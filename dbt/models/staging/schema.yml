version: 2

models:
  - name: stg_stock_prices
    description: "Daily closing prices per ticker, cleaned."
    columns:
      - name: price_key
        description: "ticker|price_date, unique per row."
        data_tests:
          - unique
          - not_null
      - name: ticker
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AAPL', 'MSFT', 'NVDA', 'AMZN', 'META', 'GOOGL']
      - name: price_date
        data_tests:
          - not_null
      - name: close_price_usd
        data_tests:
          - not_null

  - name: stg_trades
    description: "Trade log with real data types."
    columns:
      - name: trade_id
        data_tests:
          - unique
          - not_null
      - name: trade_date
        data_tests:
          - not_null
      - name: ticker
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AAPL', 'MSFT', 'NVDA', 'AMZN', 'META', 'GOOGL']
      - name: shares
        data_tests:
          - not_null
      - name: price_paid_usd
        data_tests:
          - not_null

  - name: stg_exchange_rates
    description: "USD to NGN rate per calendar day."
    columns:
      - name: rate_date
        data_tests:
          - unique
          - not_null
      - name: usd_to_ngn
        data_tests:
          - not_null
